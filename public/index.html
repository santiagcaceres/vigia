<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vigía</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23e5484d'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login" class="login hidden">
  <form id="login-form" class="login-card">
    <div class="brand big"><span class="dot"></span>Vigía</div>
    <p class="muted">Detección de hurtos en cámaras</p>
    <label>Usuario<input name="username" autocomplete="username" required></label>
    <label>Clave<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="primary" type="submit">Entrar</button>
    <p id="login-error" class="error"></p>
  </form>
</div>

<div id="app" class="hidden">
  <header class="topbar">
    <div class="brand"><span class="dot"></span>Vigía</div>
    <nav id="nav"></nav>
    <div class="user"><span id="user-name"></span><button id="logout" class="ghost small">Salir</button></div>
  </header>
  <main id="view"></main>
</div>
<div id="toast" class="toast hidden"></div>
<script src="app.js"></script>
</body>
</html>
