<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analítica Crítica</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login" class="login hidden">
  <form id="login-form" class="login-card">
    <div class="brand big"><span class="mark"></span>Analítica Crítica</div>
    <p class="muted">Analítica de video para comercios: posibles hurtos y métricas de tus cámaras</p>
    <label>Usuario<input name="username" autocomplete="username" required></label>
    <label>Clave<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="primary" type="submit">Entrar</button>
    <p id="login-error" class="error"></p>
  </form>
</div>

<div id="app" class="hidden">
  <header class="topbar">
    <div class="brand"><span class="mark"></span>Analítica Crítica</div>
    <nav id="nav"></nav>
    <div class="user"><span id="user-name"></span><button id="my-password" class="ghost small">Mi clave</button><button id="logout" class="ghost small">Salir</button></div>
  </header>
  <main id="view"></main>
</div>
<div id="toast" class="toast hidden"></div>
<script src="app.js"></script>
<script src="prueba.js"></script>
</body>
</html>
