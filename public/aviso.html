<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analítica Crítica · Aviso</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<style>
  /* estilo de Analítica Crítica (como la web y la app): azul de la marca sobre fondo claro */
  :root { --bg:#f3f5f9; --panel:#fff; --line:#d8dee9; --text:#1d2433; --muted:#667085; --accent:#011b5d;
    --logo:url("/img/logo.png"); color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
    font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:20px; margin-bottom:20px; color:var(--accent); }
  .mark { width:30px; height:30px; flex:none; background:var(--logo) center / contain no-repeat; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .card .pad { padding:18px; }
  .tag { display:inline-block; background:#c0392b; color:#fff; font-weight:600; font-size:13px;
    padding:4px 10px; border-radius:999px; }
  h1 { font-size:19px; margin:12px 0 4px; }
  .muted { color:var(--muted); }
  .msg { margin:14px 0; font-size:17px; }
  video, .poster { width:100%; display:block; background:#000; max-height:70vh; }
  .state { text-align:center; padding:48px 16px; }
  .state h1 { font-size:20px; }
  .foot { text-align:center; color:var(--muted); font-size:13px; margin-top:22px; }
  a.btn { display:inline-block; background:var(--accent); color:#fff; text-decoration:none; font-weight:600;
    padding:11px 18px; border-radius:10px; margin-top:6px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="mark"></span>Analítica Crítica</div>
  <div id="content"><div class="state muted">Cargando…</div></div>
  <div class="foot">Enviado por el servicio de monitoreo. Este enlace es privado y vence con el tiempo.</div>
</div>
<script src="aviso.js"></script>
</body>
</html>
