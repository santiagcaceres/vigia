<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vigía · Aviso</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23e5484d'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root { --bg:#0e1116; --panel:#161b22; --line:#2a333f; --text:#e6edf3; --muted:#8b98a8; --accent:#e5484d; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) { --bg:#f5f6f8; --panel:#fff; --line:#dde1e6; --text:#1b1f24; --muted:#5f6b7a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
    font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:20px; margin-bottom:20px; }
  .dot { width:14px; height:14px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 5px rgba(229,72,77,.22); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .card .pad { padding:18px; }
  .tag { display:inline-block; background:var(--accent); color:#fff; font-weight:600; font-size:13px;
    padding:4px 10px; border-radius:999px; }
  h1 { font-size:19px; margin:12px 0 4px; }
  .muted { color:var(--muted); }
  .msg { margin:14px 0; font-size:17px; }
  video, .poster { width:100%; display:block; background:#000; max-height:70vh; }
  .state { text-align:center; padding:48px 16px; }
  .state h1 { font-size:20px; }
  .foot { text-align:center; color:var(--muted); font-size:13px; margin-top:22px; }
  a.btn { display:inline-block; background:var(--accent); color:#fff; text-decoration:none; font-weight:600;
    padding:11px 18px; border-radius:10px; margin-top:6px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="dot"></span>Vigía</div>
  <div id="content"><div class="state muted">Cargando…</div></div>
  <div class="foot">Enviado por el servicio de monitoreo. Este enlace es privado y vence con el tiempo.</div>
</div>
<script>
  "use strict";
  var esc = function (v) { return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var token = new URLSearchParams(location.search).get("t");
  var box = document.getElementById("content");
  function state(title, detail) {
    box.innerHTML = '<div class="state"><h1>' + esc(title) + '</h1>' +
      (detail ? '<p class="muted">' + esc(detail) + '</p>' : '') + '</div>';
  }
  function fmt(iso) { try { return new Date(iso).toLocaleString("es-UY", { dateStyle: "long", timeStyle: "short" }); } catch (e) { return iso || ""; } }

  if (!token) {
    state("Enlace inválido", "Faltan datos en el enlace. Pedí que te lo reenvíen.");
  } else {
    fetch("/api/r/" + encodeURIComponent(token)).then(function (r) {
      if (r.status === 410) { state("El enlace venció", "Por seguridad, los enlaces caducan. Pedí uno nuevo al monitoreo."); return null; }
      if (r.status === 404) { state("El enlace no existe", "Puede haber sido dado de baja. Pedí que te lo reenvíen."); return null; }
      if (!r.ok) { state("No se pudo cargar", "Probá de nuevo en un rato."); return null; }
      return r.json();
    }).then(function (d) {
      if (!d) return;
      var clip = "/api/r/" + encodeURIComponent(token) + "/clip";
      var snap = "/api/r/" + encodeURIComponent(token) + "/snapshot";
      var media = d.has_clip
        ? '<video controls playsinline autoplay muted poster="' + (d.has_snapshot ? snap : "") + '"><source src="' + clip + '" type="video/mp4"></video>'
        : (d.has_snapshot ? '<img class="poster" src="' + snap + '" alt="">' : "");
      box.innerHTML = '<div class="card">' + media + '<div class="pad">' +
        '<span class="tag">Posible hurto</span>' +
        '<h1>' + esc(d.client_name) + (d.camera_name ? ' · ' + esc(d.camera_name) : '') + '</h1>' +
        (d.occurred_at ? '<div class="muted">' + esc(fmt(d.occurred_at)) + '</div>' : '') +
        '<p class="msg">' + esc(d.message) + '</p>' +
        (d.has_clip ? '<a class="btn" href="' + clip + '" download>Descargar el clip</a>' : '') +
        '</div></div>';
    }).catch(function () { state("No se pudo cargar", "Revisá tu conexión e intentá de nuevo."); });
  }
</script>
</body>
</html>
