# Compila el agente como un .exe de Windows (no hace falta Python en la PC central).
# Se dispara a mano desde GitHub (Actions → "Agente para Windows" → Run workflow) o al subir
# una etiqueta agente-vX.Y.Z. El .exe queda en "Artifacts" de la corrida y, con etiqueta,
# también en Releases.
name: Agente para Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a publicar en Releases (ej. 1.0.0). Vacío = solo artefacto"
        required: false
        default: ""
  push:
    tags: ["agente-v*"]

# solo lectura: lo que se instala para compilar (pip) no puede tocar el repo ni las versiones publicadas; publicar
# lo hace otro trabajo aparte, el único con permiso de escritura, sin acciones de terceros
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false  # (el token no queda en .git/config al alcance de los paquetes)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-agent.txt pyinstaller==6.22.3
          # en Windows, la versión con DirectML usa la placa de video (NVIDIA, AMD o Intel) y si no hay, el procesador
          pip uninstall -y onnxruntime
          pip install onnxruntime-directml
          python -c "import onnxruntime as o; print(o.get_available_providers())"
      - name: Grabar la versión en el programa
        run: |
          $v = "${{ startsWith(github.ref, 'refs/tags/agente-v') && github.ref_name || inputs.version }}" -replace '^agente-v', ''
          if (-not $v) { $v = "dev-${{ github.run_number }}" }
          Set-Content -Path agent\version.py -Value "VERSION = `"$v`"" -Encoding utf8
          Get-Content agent\version.py
      - name: Compilar
        run: pyinstaller agente_pc.spec
      - name: Probar que arranca
        run: |
          $p = Start-Process -FilePath dist\VigiaAgente.exe -ArgumentList "--help" -PassThru -Wait
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Armar carpeta
        # el .exe va como VigiaAgente.exe: las versiones viejas (hasta la 1.21) solo saben actualizarse con ese
        # nombre; al arrancar, el programa deja una copia «Analítica Crítica.exe» y la abre
        run: |
          New-Item -ItemType Directory -Force dist\AnaliticaCritica | Out-Null
          Copy-Item dist\VigiaAgente.exe dist\AnaliticaCritica\
          Copy-Item agent\LEEME-agente.txt dist\AnaliticaCritica\LEEME.txt
          Compress-Archive -Path dist\AnaliticaCritica\* -DestinationPath dist\AnaliticaCritica-windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: AnaliticaCritica-windows
          path: dist\AnaliticaCritica-windows.zip
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/agente-v') || inputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AnaliticaCritica-windows
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/agente-v') && github.ref_name || format('agente-v{0}', inputs.version) }}
          NOTES: "App de escritorio de Analítica Crítica para Windows. Primera vez: descomprimir y abrir VigiaAgente.exe (queda como «Analítica Crítica.exe»). Para actualizar: botón «Buscar actualización» dentro de la app; agente.env se conserva."
        run: |
          ls -la AnaliticaCritica-windows.zip
          gh release create "$TAG" AnaliticaCritica-windows.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Agente $TAG" --notes "$NOTES" --latest
